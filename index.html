<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram InitData - Ko'rsatish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1976d2;
        }

        .info-box strong {
            color: #1565c0;
        }

        .data-section {
            margin-bottom: 25px;
        }

        .data-section h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .data-display {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            word-break: break-all;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            color: #333;
        }

        .user-info {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .user-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .user-info-item:last-child {
            border-bottom: none;
        }

        .user-info-label {
            font-weight: 600;
            color: #666;
        }

        .user-info-value {
            color: #333;
            text-align: right;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
            border: 4px solid #0088cc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0088cc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        button:hover {
            background: #006ba3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Telegram InitData</h1>
        <p class="subtitle">Telegram Web App dan initData ma'lumotlari</p>

        <div id="status" class="status" style="display: none;"></div>

        <div class="info-box">
            <strong>ℹ️ Ma'lumot:</strong><br>
            Bu sahifa Telegram Web App dan initData ni oladi va ko'rsatadi.
            API ga so'rov yuborilmaydi.
        </div>

        <!-- User ma'lumotlari -->
        <div id="userSection" class="data-section" style="display: none;">
            <h3>👤 Foydalanuvchi ma'lumotlari</h3>
            <div id="userInfo" class="user-info"></div>
        </div>

        <!-- InitData -->
        <div class="data-section">
            <h3>📋 InitData (To'liq)</h3>
            <div id="initDataDisplay" class="data-display">
                Ma'lumotlar yuklanmoqda...
            </div>
            <button onclick="copyInitData()">📋 InitData ni nusxalash</button>
        </div>

        <!-- Parsed Data -->
        <div class="data-section">
            <h3>🔍 Parsed Data (JSON)</h3>
            <div id="parsedDataDisplay" class="data-display">
                Ma'lumotlar yuklanmoqda...
            </div>
            <button onclick="copyParsedData()">📋 Parsed Data ni nusxalash</button>
        </div>
    </div>

    <script>
        // Telegram Web App инициализация
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // InitData ni olish va ko'rsatish
        function loadInitData() {
            const initData = tg.initData || "";
            const initDataUnsafe = tg.initDataUnsafe || {};
            const user = initDataUnsafe.user || {};

            // Status ko'rsatish
            const statusDiv = document.getElementById('status');
            
            if (!initData) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ InitData topilmadi! Iltimos, Telegram ichida oching.';
                statusDiv.style.display = 'block';
                document.getElementById('initDataDisplay').textContent = 'InitData mavjud emas';
                return;
            }

            statusDiv.className = 'status success';
            statusDiv.textContent = '✅ InitData muvaffaqiyatli olindi!';
            statusDiv.style.display = 'block';

            // InitData ni ko'rsatish
            document.getElementById('initDataDisplay').textContent = initData;

            // User ma'lumotlarini ko'rsatish
            if (user && Object.keys(user).length > 0) {
                const userSection = document.getElementById('userSection');
                const userInfo = document.getElementById('userInfo');
                
                let userInfoHTML = '';
                
                if (user.photo_url) {
                    userInfoHTML += `<img src="${user.photo_url}" alt="Avatar" class="avatar">`;
                }
                
                userInfoHTML += '<div class="user-info-item">';
                userInfoHTML += '<span class="user-info-label">ID:</span>';
                userInfoHTML += `<span class="user-info-value">${user.id || 'N/A'}</span>`;
                userInfoHTML += '</div>';
                
                userInfoHTML += '<div class="user-info-item">';
                userInfoHTML += '<span class="user-info-label">Ism:</span>';
                userInfoHTML += `<span class="user-info-value">${user.first_name || 'N/A'}</span>`;
                userInfoHTML += '</div>';
                
                userInfoHTML += '<div class="user-info-item">';
                userInfoHTML += '<span class="user-info-label">Familiya:</span>';
                userInfoHTML += `<span class="user-info-value">${user.last_name || 'N/A'}</span>`;
                userInfoHTML += '</div>';
                
                userInfoHTML += '<div class="user-info-item">';
                userInfoHTML += '<span class="user-info-label">Username:</span>';
                userInfoHTML += `<span class="user-info-value">@${user.username || 'N/A'}</span>`;
                userInfoHTML += '</div>';
                
                userInfoHTML += '<div class="user-info-item">';
                userInfoHTML += '<span class="user-info-label">Til:</span>';
                userInfoHTML += `<span class="user-info-value">${user.language_code || 'N/A'}</span>`;
                userInfoHTML += '</div>';
                
                userInfo.innerHTML = userInfoHTML;
                userSection.style.display = 'block';
            }

            // Parsed Data ni ko'rsatish
            try {
                const parsedData = parseInitData(initData);
                document.getElementById('parsedDataDisplay').textContent = 
                    JSON.stringify(parsedData, null, 2);
            } catch (error) {
                document.getElementById('parsedDataDisplay').textContent = 
                    'Xato: ' + error.message;
            }

            // Console ga chiqarish
            console.log('=== Telegram InitData ===');
            console.log('InitData:', initData);
            console.log('InitDataUnsafe:', initDataUnsafe);
            console.log('User:', user);
        }

        // InitData ni parse qilish
        function parseInitData(initData) {
            const params = new URLSearchParams(initData);
            const result = {};
            
            for (const [key, value] of params.entries()) {
                if (key === 'user') {
                    try {
                        result[key] = JSON.parse(decodeURIComponent(value));
                    } catch (e) {
                        result[key] = value;
                    }
                } else {
                    result[key] = value;
                }
            }
            
            return result;
        }

        // InitData ni nusxalash
        function copyInitData() {
            const initData = tg.initData || "";
            if (!initData) {
                alert('InitData mavjud emas!');
                return;
            }
            
            navigator.clipboard.writeText(initData).then(() => {
                showMessage('✅ InitData nusxalandi!', 'success');
            }).catch(err => {
                showMessage('❌ Nusxalashda xato: ' + err.message, 'error');
            });
        }

        // Parsed Data ni nusxalash
        function copyParsedData() {
            const initData = tg.initData || "";
            if (!initData) {
                alert('InitData mavjud emas!');
                return;
            }
            
            try {
                const parsedData = parseInitData(initData);
                const jsonString = JSON.stringify(parsedData, null, 2);
                
                navigator.clipboard.writeText(jsonString).then(() => {
                    showMessage('✅ Parsed Data nusxalandi!', 'success');
                }).catch(err => {
                    showMessage('❌ Nusxalashda xato: ' + err.message, 'error');
                });
            } catch (error) {
                showMessage('❌ Xato: ' + error.message, 'error');
            }
        }

        // Xabar ko'rsatish
        function showMessage(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                if (type === 'success') {
                    statusDiv.style.display = 'none';
                }
            }, 3000);
        }

        // Sayt yuklanganda initData ni yuklash
        window.addEventListener('load', () => {
            loadInitData();
        });

        // Agar initData o'zgarsa, qayta yuklash
        if (tg.onEvent) {
            tg.onEvent('viewportChanged', () => {
                loadInitData();
            });
        }
    </script>
</body>
</html>
