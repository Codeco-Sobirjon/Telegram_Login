<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram MiniApp Login</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #aaa;
        }

        .profile {
            margin-top: 20px;
        }

        img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-top: 10px;
        }

        .debug {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            text-align: left;
            font-size: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Telegram MiniApp Login</h2>
        <button id="loginBtn">Login with Telegram</button>

        <div class="profile" id="profile" style="display: none;">
            <p><strong>Welcome, <span id="name"></span>!</strong></p>
            <img id="photo" src="" alt="Profile Photo">
            <p>Referral code used: <span id="referralCode"></span></p>
        </div>

        <div class="debug" id="debugInfo">
            <h4>Debug Information:</h4>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Backend URL ni o'zgartiring
        const API_BASE_URL = 'http://localhost:8000'; // Yoki production URL: 'https://your-domain.com'

        function getReferralCode() {
            const startParam = tg.initDataUnsafe?.start_param;
            if (startParam) {
                console.log("Referral code from start_param:", startParam);
                return startParam;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                console.log("Referral code from URL:", refCode);
                return refCode;
            }

            console.log("No referral code found.");
            return null;
        }

        document.getElementById("loginBtn").addEventListener("click", function () {
            const initData = tg.initData || "";
            const referralCode = getReferralCode();

            console.log("Init Data:", initData);
            console.log("Referral Code:", referralCode);

            if (!initData) {
                alert("Telegram data not found! Please make sure you're running inside Telegram.");
                return;
            }

            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerText = "Authenticating...";
            
            // Backend API endpoint
            const apiUrl = `${API_BASE_URL}/api/v1/accounts/auth/telegram/`;
            
            console.log("Sending request to:", apiUrl);
            console.log("Init Data:", initData);

            fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    initData: initData,  // camelCase format
                    referral_code: referralCode
                })
            })
                .then(response => {
                    console.log("Response status:", response.status);
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error || `HTTP error! Status: ${response.status}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Response data:", data);
                    
                    if (data.access_token) {
                        // Tokenlarni saqlash
                        localStorage.setItem("access_token", data.access_token);
                        localStorage.setItem("refresh_token", data.refresh_token);

                        // User ma'lumotlarini ko'rsatish
                        const user = data.user || tg.initDataUnsafe?.user;
                        if (user) {
                            document.getElementById("name").innerText = user.first_name || "User";
                            if (user.photo_url) {
                                document.getElementById("photo").src = user.photo_url;
                            }
                        }

                        document.getElementById("referralCode").innerText = data.referral_code_used || "None";
                        document.getElementById("profile").style.display = "block";

                        // Telegram bot ga ma'lumot yuborish
                        if (tg.sendData) {
                            tg.sendData(JSON.stringify({
                                auth: "success",
                                referral_code: referralCode
                            }));
                        }

                        // Keyingi API so'rovlari uchun token ishlatish misoli
                        console.log("Token saved! You can now use it for API requests:");
                        console.log("Authorization: Bearer " + data.access_token);
                    } else {
                        throw new Error("Authentication failed: " + (data.error || "No access token received"));
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Error during authentication: " + error.message);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = "Login with Telegram";
                });
        });

        // Keyingi API so'rovlari uchun misol funksiya
        function makeAuthenticatedRequest(url, method = 'GET', body = null) {
            const token = localStorage.getItem('access_token');
            if (!token) {
                console.error('No access token found. Please login first.');
                return Promise.reject('No token');
            }

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };

            return fetch(url, {
                method: method,
                headers: headers,
                body: body ? JSON.stringify(body) : null
            })
            .then(response => {
                if (response.status === 401) {
                    // Token eskirgan, refresh qilish kerak
                    console.log('Token expired, need to refresh');
                    // Refresh token logikasi qo'shishingiz kerak
                }
                return response.json();
            });
        }

        // Misol: User ma'lumotlarini olish
        // makeAuthenticatedRequest(`${API_BASE_URL}/api/v1/accounts/me/`)
        //     .then(data => console.log('User data:', data));
    </script>

</body>

</html>
